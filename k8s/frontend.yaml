# Frontend: nginx ze stroną, /api/ przekazuje do Service "backend" (jak w W3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ir-teach/stacja-frontend:0a3fa12823b5ce5abaeaf99584459aa0a47aea9c
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer              # wejście z zewnątrz; Docker Desktop wystawia je na localhost
  selector: { app: frontend }
  ports:
    - port: 8080                  # http://localhost:8080
      targetPort: 80
